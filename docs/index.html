import * as THREE from "three";

// 部品をまたいで使う共有の値はここに集める（開発ツールからは window.__floating で見える）
const G = (window.__floating = {});
// 点を丸く柔らかく描くための小さな画像（蛍・花びら・落ち葉など）
G.dotTex = (() => {
  const c = document.createElement("canvas");
  c.width = c.height = 32;
  const g = c.getContext("2d"),
    gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
  gr.addColorStop(0, "rgba(255,255,255,1)");
  gr.addColorStop(0.45, "rgba(255,255,255,.8)");
  gr.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = gr;
  g.fillRect(0, 0, 32, 32);
  return new THREE.CanvasTexture(c);
})();

var LEAFTX;
function mkLeaf() {
  return cvTex(128, 128, (g, w, h) => {
    g.fillStyle = "#f2f2ee";
    g.fillRect(0, 0, w, h);
    for (let i = 0; i < 180; i++) {
      const x = Math.random() * w,
        y = Math.random() * h,
        r = 4 + Math.random() * 7;
      const gr = g.createRadialGradient(x, y - r * 0.3, 0, x, y, r);
      gr.addColorStop(0, "rgba(255,255,240,.55)");
      gr.addColorStop(0.6, "rgba(200,200,200,.2)");
      gr.addColorStop(1, "rgba(40,50,40,.4)");
      g.fillStyle = gr;
      g.beginPath();
      g.arc(x, y, r, 0, 7);
      g.fill();
    }
    for (let i = 0; i < 900; i++) {
      g.strokeStyle = `rgba(${Math.random() < 0.5 ? 30 : 255},${Math.random() < 0.5 ? 40 : 255},30,.18)`;
      g.lineWidth = 1;
      const x = Math.random() * w,
        y = Math.random() * h,
        a = Math.random() * 6.3;
      g.beginPath();
      g.moveTo(x, y);
      g.lineTo(x + Math.cos(a) * 4, y + Math.sin(a) * 4);
      g.stroke();
    }
  });
}

function NEAR_TREE_MAT() {
  if (!LEAFTX) {
    LEAFTX = mkLeaf();
    LEAFTX.wrapS = LEAFTX.wrapT = THREE.RepeatWrapping;
    LEAFTX.repeat.set(3, 3);
  }
  return new THREE.MeshLambertMaterial({ vertexColors: true, map: LEAFTX });
}

/* ---------- 音：すべてWeb Audioで合成（外部の音源なし）。波と風が土台 ---------- */
const SND = { on: true, ctx: null };
function audioInit() {
  if (SND.ctx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const ac = new AC();
  SND.ctx = ac;
  const len = ac.sampleRate * 4,
    mk = (type) => {
      const b = ac.createBuffer(1, len, ac.sampleRate),
        d = b.getChannelData(0);
      let l = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        if (type === "brown") {
          l = (l + 0.02 * w) / 1.02;
          d[i] = l * 3.5;
        } else d[i] = w;
      }
      return b;
    };
  SND.white = mk("white");
  SND.brown = mk("brown");
  const src = (b) => {
    const s = ac.createBufferSource();
    s.buffer = b;
    s.loop = true;
    s.start(0, Math.random() * 3);
    return s;
  };
  SND.master = ac.createGain();
  SND.master.gain.value = 0;
  SND.master.connect(ac.destination);
  SND.master.gain.setTargetAtTime(0.9, ac.currentTime + 0.3, 1.5); // ゆっくりフェードイン
  // 波：低いノイズをゆっくり膨らませる
  const wv = src(SND.brown),
    wvF = ac.createBiquadFilter();
  wvF.type = "lowpass";
  wvF.frequency.value = 220; // 波のざわめきは柔らかく（高域を落とす）
  SND.waveG = ac.createGain();
  SND.waveG.gain.value = 0;
  wv.connect(wvF).connect(SND.waveG).connect(SND.master);
  // 風：帯域ノイズ、中心周波数を揺らす
  const wd = src(SND.white),
    wdF = ac.createBiquadFilter();
  wdF.type = "bandpass";
  wdF.Q.value = 0.45;
  wdF.frequency.value = 500;
  SND.windF = wdF;
  SND.windG = ac.createGain();
  SND.windG.gain.value = 0;
  {
    const lp = ac.createBiquadFilter(); // 風はこもった柔らかい音色に
    lp.type = "lowpass";
    lp.frequency.value = 1400;
    wd.connect(wdF).connect(lp).connect(SND.windG).connect(SND.master);
  }
  // ヨシのそよぎ：高いノイズ
  const rd = src(SND.white),
    rdF = ac.createBiquadFilter();
  rdF.type = "bandpass";
  rdF.frequency.value = 2600;
  rdF.Q.value = 0.4;
  SND.reedG = ac.createGain();
  SND.reedG.gain.value = 0;
  rd.connect(rdF).connect(SND.reedG).connect(SND.master);
  // 岸の波：寄せては返す
  const sh = src(SND.brown),
    shF = ac.createBiquadFilter();
  shF.type = "lowpass";
  shF.frequency.value = 900;
  SND.shoreF = shF;
  SND.shoreG = ac.createGain();
  SND.shoreG.gain.value = 0;
  sh.connect(shF).connect(SND.shoreG).connect(SND.master);
  // 残響：短い合成インパルスで、水辺の空気の広がりを出す
  {
    const L = ac.sampleRate * 3.2,
      ir = ac.createBuffer(2, L, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      for (let i = 0; i < L; i++)
        d[i] =
          (Math.random() * 2 - 1) *
          Math.pow(1 - i / L, 3.2) *
          (i < ac.sampleRate * 0.02 ? i / (ac.sampleRate * 0.02) : 1);
    }
    SND.rev = ac.createConvolver();
    SND.rev.buffer = ir;
    SND.revG = ac.createGain();
    SND.revG.gain.value = 0.55;
    SND.rev.connect(SND.revG).connect(SND.master);
  }
  SND.nextSlap = 0;
  SND.nextGrain = 0;
  SND.nextShore = 0;
  SND.nextSwell = 0;
  {
    const s2 = src(SND.brown),
      f2 = ac.createBiquadFilter();
    f2.type = "lowpass";
    f2.frequency.value = 200;
    f2.Q.value = 0.3;
    SND.swF = f2;
    SND.swG = ac.createGain();
    SND.swG.gain.value = 0;
    SND.swP = ac.createStereoPanner();
    s2.connect(f2).connect(SND.swG).connect(SND.swP).connect(SND.master);
    SND.swG.connect(SND.rev);
  }
  SND.engines = new Map();
  SND.nextBird = ac.currentTime + 4;
  SND.nextLap = 0;
}
// 自然音だけで：船体に当たる水（沖）、水の粒のさざめき、寄せては返す岸の波
function nburst(lp, hp, dur, vol, pn, q = 0.7, toRev = 0.5) {
  const ac = SND.ctx,
    t = ac.currentTime,
    s = ac.createBufferSource();
  s.buffer = SND.white;
  const a = ac.createBiquadFilter(),
    b = ac.createBiquadFilter(),
    g = ac.createGain(),
    p = ac.createStereoPanner(),
    r = ac.createGain();
  a.type = "lowpass";
  a.frequency.value = lp;
  a.Q.value = q;
  b.type = "highpass";
  b.frequency.value = hp;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + Math.max(Math.min(0.03, dur * 0.2), SND.atk || 0));
  g.gain.exponentialRampToValueAtTime(0.0004, t + dur);
  p.pan.value = pn;
  r.gain.value = toRev;
  s.connect(a).connect(b).connect(g).connect(p);
  p.connect(SND.master);
  p.connect(r);
  r.connect(SND.rev);
  s.start(t, Math.random() * 3);
  s.stop(t + dur + 0.05);
}

function pan(x, z) {
  const p = SND.ctx.createStereoPanner();
  const dx = x - camera.position.x,
    dz = z - camera.position.z,
    r = Math.cos(yaw) * dx - Math.sin(yaw) * dz;
  p.pan.value = Math.max(-1, Math.min(1, r / Math.max(30, Math.hypot(dx, dz))));
  return p;
}
function horn(x, z, d) {
  const ac = SND.ctx,
    t = ac.currentTime,
    g = ac.createGain(),
    f = ac.createBiquadFilter(),
    vol = Math.min(0.35, 60 / (d + 60));
  f.type = "lowpass";
  f.frequency.value = 900;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.25);
  g.gain.setValueAtTime(vol, t + 2.2);
  g.gain.linearRampToValueAtTime(0, t + 3.2);
  for (const fr of [147, 185, 220]) {
    const o = ac.createOscillator();
    o.type = "sine";
    o.frequency.value = fr;
    o.connect(f);
    o.start(t);

      z = m ? m.position.z : b.y * S,

      f.frequency.value = b.kind === "fish" ? 500 : 260;

/* ---------- 持ち帰る線画：湖岸線・等深線・自分の軌跡・出発点・最後の点。文字なし、白と黒だけ、縦長 ---------- */
function makeDrawing() {

  const cx = (a + c2) / 2,

    sp = Math.min(lakeSpan, span * (1 - k) + lakeSpan * k),
    ccx = cx * (1 - k) + ((minX + maxX) / 2) * k,

      g.moveTo(X(P[i][0]), Y(P[i][1]));
      g.lineTo(X(P[i + 1][0]), Y(P[i + 1][1]));

    poly.forEach(([x, y], i) => (i ? g.lineTo(X(x), Y(y)) : g.moveTo(X(x), Y(y))));
    g.closePath();
  }
  g.stroke();
  g.lineWidth = 3.2;
  g.beginPath();
  pts.forEach(([x, y], i) => (i ? g.lineTo(X(x), Y(y)) : g.moveTo(X(x), Y(y))));
  g.stroke();
  g.lineWidth = 2.4;
  g.fillStyle = "#fff";
  g.beginPath();
  g.arc(X(pts[0][0]), Y(pts[0][1]), 9, 0, 7);
  g.fill();
  g.stroke();
  g.fillStyle = "#000";

}

on": 136.18831, "url": "https://youtu.be/jSQpETXCC40?si=RTUJtfseuhQZchTv"}];
  const red = new THREE.MeshStandardMaterial({
      color: 0xff4a24,
      roughness: 0.3,
      metalness: 0,
      emissive: 0x3a0c00,
    }),
    rope = new THREE.MeshLambertMaterial({ color: 0xe8e2cf }),
    hitM = new THREE.MeshBasicMaterial({ visible: false });
  const placed = [],
    BUOY_HALO = (() => {
      const c = document.createElement("canvas");
      c.width = c.height = 64;

  const items = LIST.map((b) => {

        r = 10 + k * 8;

      if (Math.hypot(p[0] - x * S, p[1] - y * S) < 8) {

  const ray = new THREE.Raycaster(),

  gl.addEventListener("pointerdown", (e) => {

  });
  gl.addEventListener("pointerup", (e) => {
    if (!down || STATE !== "lake" || isFar) return;
    const moved = Math.hypot(e.clientX - down[0], e.clientY - down[1]),
      dtm = performance.now() - down[2];
    down = null;
    if (moved > 8 || dtm > 600) return;
    const it = pick(e);
    if (!it) return;

    if (dB > NEAR) {

      clearTimeout(hn._t);
      hn._t = setTimeout(() => (hn.style.opacity = 0), 2200);
      return;

    VIS.add(it.url);
    try {
      localStorage.setItem("floating.visited.v1", JSON.stringify([...VIS]));

    a.href = it.url;
    a.target = "_blank";
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    a.remove();
  });
  gl.addEventListener("pointermove", (e) => {
    if (e.pointerType !== "mouse" || ptrs.size) return;
    gl.style.cursor = STATE === "lake" && !isFar && pick(e) ? "pointer" : "";
  });
  function update(t, night) {
    const qx = B.x * S,
      qz = B.y * S;
    for (const it of items) {
      const near = Math.hypot(it.g.position.x - qx, it.g.position.z - qz) < NEAR;
      it.nk = (it.nk || 0) + ((near ? 1 : 0) - (it.nk || 0)) * 0.04;
      if (!it.rip) {
        const rm = new THREE.Mesh(
          new THREE.RingGeometry(0.9, 1.05, 40).rotateX(-Math.PI / 2),
          new THREE.MeshBasicMaterial({ color: 0xffe2c8, transparent: true, opacity: 0, depthWrite: false }),
        );
        rm.position.y = 0.06;
        it.g.add(rm);
        it.rip = rm;
      }
      {
        const ph = (t * 0.45 + it.ph) % 1;
        it.rip.scale.setScalar(1 + ph * 5);
        it.rip.material.opacity = it.nk * (1 - ph) * 0.55;
        it.rip.visible = it.nk > 0.02;
      }
      const x = it.g.position.x,
        z = it.g.position.z,
        h = waveH(x, z, t),
        hx = waveH(x + 1, z, t) - h,
        hz = waveH(x, z + 1, t) - h;
      it.g.position.y = h * 0.9 + Math.sin(t * 1.3 + it.ph) * 0.03;
      it.g.rotation.set(hz * 0.6, 0, -hx * 0.6);
      if (it.name && !it.name.startsWith("（") && !it.lab) {
        const c = document.createElement("canvas");
        c.width = 256;
        c.height = 64;
        const x = c.getContext("2d");
        x.font = '300 34px "Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif';
        x.textAlign = "center";
        x.textBaseline = "middle";
        x.shadowColor = "rgba(0,0,0,.55)";
        x.shadowBlur = 8;
        x.fillStyle = "#fff";
        x.fillText(it.name, 128, 32);
        const tx = new THREE.CanvasTexture(c);
        tx.colorSpace = THREE.SRGBColorSpace;
        const sp = new THREE.Sprite(
          new THREE.SpriteMaterial({ map: tx, transparent: true, depthWrite: false, opacity: 0, fog: false }),
        );
        sp.scale.set(13, 3.25, 1);
        sp.position.y = 4.2;
        it.g.add(sp);
        it.lab = sp;
      }
      if (it.lab) {
        it.lab.material.opacity = Math.min(1, it.nk * 1.2);
        it.lab.visible = it.nk > 0.02;
      }
      it.glow.visible = night || it.nk > 0.02;
      it.glow.material.opacity =
        (night ? 0.42 : 0) +
        it.nk * (0.35 + 0.15 * Math.sin(t * 2.2 + it.ph)) +
        0.06 * Math.sin(t * 0.7 + it.ph);
      it.glow.scale.setScalar(8 + it.nk * 4);
    }
    red.emissive.set(night ? 0x7a1e0a : 0x3a0c00);
  }
  return {
    items,
    update,
    sp: (i) => {
      const v = items[i].ball.getWorldPosition(new THREE.Vector3()).project(camera),
        r = gl.getBoundingClientRect();
      return [r.left + ((v.x + 1) / 2) * r.width, r.top + ((1 - v.y) / 2) * r.height];
    },
  };
})();

G.EV = (() => {

    const c = document.createElement("canvas");

    const tx = new THREE.CanvasTexture(c);

    tx.minFilter = THREE.LinearFilter;
    return tx;
  })();
  const R = rnd(2718);
  const sites = [];
  for (let k = 0; k < 6 && reedPts.length; k++) {
    const p = reedPts[Math.floor(R() * reedPts.length)];
    sites.push([p[0] * S, p[1] * S]);
  }
  const smoke = [];
  for (let i = 0; i < 90; i++) {
    const s = new THREE.Sprite(
      new THREE.SpriteMaterial({
        map: smokeTx,
        color: 0xb9b4aa,
        transparent: true,
        depthWrite: false,
        opacity: 0,
      }),
    );
    s.visible = false;
    s.userData = { a: -1 };
    g.add(s);
    smoke.push(s);
  }
  const fires = sites.map(([x, z]) => {
    const l = new THREE.Sprite(
      new THREE.SpriteMaterial({
        map: smokeTx,
        color: 0xff8a30,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        opacity: 0,
      }),
    );
    l.position.set(x, 1.2, z);
    l.scale.set(9, 4, 1);
    l.visible = false;
    g.add(l);
    return l;
  });
  let si = 0,
    spT = 0;
  // 飛ぶ鳥の形：細い胴と、先へ細くなり少し後ろへ反る翼（羽ばたきは翼端の上下で表す）
  const wing = (() => {
    const p = [];
    const prof = [
      [0, 0, 0.22, -0.12],
      [0.25, 0.04, 0.2, -0.12],
      [0.5, 0.1, 0.14, -0.1],
      [0.75, 0.18, 0.06, -0.12],
      [0.95, 0.24, -0.02, -0.14],
    ];
    for (const s of [-1, 1])
      for (let i = 0; i < prof.length - 1; i++) {
        const [x0, y0, f0, b0] = prof[i],
          [x1, y1, f1, b1] = prof[i + 1];
        // x：横（翼幅）、y：上下、z：前後（前縁 f・後縁 b、翼端ほど後ろへ）
        const A = [s * x0, y0, f0 - x0 * 0.25],
          B = [s * x0, y0, b0 - x0 * 0.25],
          C = [s * x1, y1, f1 - x1 * 0.25],
          D = [s * x1, y1, b1 - x1 * 0.25];
        p.push(...A, ...B, ...C, ...B, ...D, ...C);
      }
    // 胴と頭・尾
    p.push(0, 0.02, 0.45, 0.05, 0, 0, -0.05, 0, 0, 0.05, 0, 0, -0.05, 0, 0, 0, 0.02, -0.35, -0.1, 0, -0.35, 0.1, 0, -0.35, 0, 0.02, -0.2);
    const gg = new THREE.BufferGeometry();
    gg.setAttribute("position", new THREE.Float32BufferAttribute(p, 3));
    gg.computeVertexNormals();
    return gg;
  })();
  const NB = 90,
    birds = new THREE.InstancedMesh(
      wing,
      new THREE.MeshLambertMaterial({ color: 0x5a5c62, side: THREE.DoubleSide }),
      NB,
    );
  birds.frustumCulled = false;
  birds.visible = false;
  g.add(birds);
  const fl = [0, 1, 2].map((i) => ({ ph: i * 2.1, off: [] }));
  for (const f of fl)
    for (let k = 0; k < 30; k++) {
      const u = Math.random(),
        v = Math.random();
      f.off.push([
        (u - 0.5) * 46 * (0.6 + 0.4 * Math.random()),
        (Math.random() - 0.5) * 5 + Math.sin(u * 6) * 2,
        (v - 0.5) * 14 * (1 - Math.abs(u - 0.5)),
      ]);
    }
  const NF = 260,
    fpos = new Float32Array(NF * 3),
    fgeo = new THREE.BufferGeometry();
  fgeo.setAttribute("position", new THREE.BufferAttribute(fpos, 3));
  const fmat = new THREE.PointsMaterial({
    color: 0xd8ff8a,

    blending: THREE.AdditiveBlending,
    depthWrite: false,
    opacity: 0,
    fog: false,

  const ffl = new THREE.Points(fgeo, fmat);

  let fAt = null;
  const fph = Float32Array.from({ length: NF }, () => Math.random() * 6.28);
  const fcol = new Float32Array(NF * 3);

      ph = c.phase,

    fires.forEach((f) => {
      f.visible = burn > 0;
      f.material.opacity = burn * (0.35 + 0.25 * Math.sin(t * 9 + f.position.x));
    });
    if (burn > 0) {
      spT -= dt;
      if (spT < 0) {
        spT = 0.12;
        const [x, z] = sites[si++ % sites.length];
        const s = smoke[si % smoke.length];
        s.position.set(x + (Math.random() - 0.5) * 10, 1, z + (Math.random() - 0.5) * 10);
        s.userData.a = 0;
        s.visible = true;
      }
    }
    for (const s of smoke) {
      const u = s.userData;
      if (u.a < 0) continue;
      u.a += dt / 22;
      if (u.a >= 1) {
        u.a = -1;
        s.visible = false;
        continue;
      }
      s.position.y += dt * (4 + u.a * 2);
      s.position.x += W.x * dt * 0.8;
      s.position.z += W.y * dt * 0.8;
      const sc = 10 + u.a * 60;
      s.scale.set(sc, sc, 1);
      s.material.opacity =
        Math.min(1, u.a * 8) *
        (1 - u.a) *
        0.42 *
        Math.max(0, 1 - Math.hypot(s.position.x - cx, s.position.z - cz) / 1400);
    }
    const win = false; // 飛ぶ鳥の群れは出さない

    if (win) {
      let n = 0;
      for (const f of fl) {
        const ang = f.ph + t * 0.004,
          cxf = cx + Math.cos(ang) * 260,
          czf = cz + Math.sin(ang) * 260,
          dir = ang + Math.PI / 2,
          hy = 22 + 10 * Math.sin(t * 0.05 + f.ph);
        Qt.setFromAxisAngle(V.set(0, 1, 0), -dir);
        for (const [a, b, cc] of f.off) {
          if (n >= NB) break;
          const ca = Math.cos(-dir),
            sa = Math.sin(-dir);
          const x = cxf + a * ca - cc * sa,
            z = czf + a * sa + cc * ca;
          // ゆったり羽ばたき、ときどき滑空する
          const fp = Math.sin(t * (3.2 + (n % 5) * 0.3) + n * 1.3),
            glide = Math.sin(t * 0.3 + n) > 0.4 ? 0.25 : 1;
          Sc.set(1.5, 1.5 * fp * glide + (glide < 1 ? 0.3 : 0), 1.5);
          M.compose(V.set(x, hy + b - fp * 0.08 * glide, z), Qt, Sc);
          birds.setMatrixAt(n++, M);
        }
      }
      birds.count = n;
      birds.instanceMatrix.needsUpdate = true;
    }
    const ff = mo === 5 && day < 0.05;
    ffl.visible = ff;
    if (ff) {
      if (!fAt || Math.hypot(fAt[0] - cx, fAt[1] - cz) > 250) {
        fAt = [cx, cz];
        const near = reedPts.filter(([x, y]) => Math.hypot(x * S - cx, y * S - cz) < 350);
        for (let i = 0; i < NF; i++) {
          const p = near.length ? near[Math.floor(Math.random() * near.length)] : [cx / S, cz / S];
          fpos[i * 3] = p[0] * S + (Math.random() - 0.5) * 14;
          fpos[i * 3 + 1] = 0.8 + Math.random() * 2.5;
          fpos[i * 3 + 2] = p[1] * S + (Math.random() - 0.5) * 14;
        }
      }
      for (let i = 0; i < NF; i++) {
        const k = Math.max(0, Math.sin(t * 1.7 + fph[i] * 3) * Math.sin(t * 0.9 + fph[i]));
        fcol[i * 3] = 0.85 * k;
        fcol[i * 3 + 1] = k;
        fcol[i * 3 + 2] = 0.5 * k;
        fpos[i * 3 + 1] += Math.sin(t + fph[i]) * dt * 0.15;
      }
      fgeo.attributes.position.needsUpdate = fgeo.attributes.color.needsUpdate = true;

          break;
        }
      }
    }
  }

    sakI = new THREE.InstancedMesh(

    new THREE.MeshLambertMaterial({ color: 0x3e3430 }),
    Math.max(1, sak.length * 3),
  );
  trI.visible = false;
  {
    const c = new THREE.Color(),
      E = new THREE.Euler();
    sak.forEach(([x, y], i) => {
      const gy = 0.6 + terrainAt(x, y) * S * VEX,
        H = 3.2 + Math.random() * 1.4,
        lean = (Math.random() - 0.5) * 0.3;
      for (let k = 0; k < 3; k++) {

          V.set(
            x * S + Math.cos(a) * r,

  const duckGeo = (() => {

    const parts = [body, neck, head, bill].map((g) => g.toNonIndexed());
    const pos = [];

  const ND = 320,

  {

  }
  duck.visible = false;
  duck.frustumCulled = false;

  // 泳ぐ鴨の後ろに残るV字の小さな波（3羽に1羽）

      const ex = -L * Math.cos(sp),
        ez = s * L * Math.sin(sp),
        nx = -ez / L,
        nz = ex / L;
      p.push(0, 0, 0, ex, 0, ez, ex + nx * w, 0, ez + nz * w, 0, 0, 0, ex + nx * w, 0, ez + nz * w, nx * w, 0, nz * w);
    }
    const gg = new THREE.BufferGeometry();
    gg.setAttribute("position", new THREE.Float32BufferAttribute(p, 3));
    return gg;
  })();
  const vw = new THREE.InstancedMesh(vGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.28, depthWrite: false, side: THREE.DoubleSide }), Math.ceil(ND / 3));
  vw.visible = false;
  vw.frustumCulled = false;
  g.add(vw);
  let dAt = null;
  const dp = [];
  const up0 = update;
  function update2(dt, c, day, t, W) {
    up0(dt, c, day, t, W);

        for (let r = 0; r < 4; r++) {

          for (let i = 0; i < 35; i++) {

        for (let r = 0; r < 3; r++) {
          const a = Math.random() * 6.28,

      duck.instanceMatrix.needsUpdate = vw.instanceMatrix.needsUpdate = true;
    }
  }
  return { update: update2, sites };
})();

// ==== 39-kaizu.js ====
G.kaizu = (() => {
  const g = new THREE.Group();
  scene.add(g);
  const KX_ = 111320 * Math.cos((35.25 * Math.PI) / 180);
  const tx = cvTex(256, 128, (c, w, h) => {
    c.fillStyle = "#8f8a80";
    c.fillRect(0, 0, w, h);
    let y = 0;
    while (y < h) {
      const rh = 14 + Math.random() * 16;
      let x = -Math.random() * 20;
      while (x < w) {
        const rw = 18 + Math.random() * 34,
          v = 150 + Math.random() * 60;
        c.fillStyle = `rgb(${v},${(v - 4) | 0},${(v - 12) | 0})`;
        c.beginPath();
        c.moveTo(x + 2, y + 2 + Math.random() * 2);
        c.lineTo(x + rw - 2, y + 1 + Math.random() * 3);
        c.lineTo(x + rw - 1, y + rh - 2);
        c.lineTo(x + 1, y + rh - 1 - Math.random() * 3);
        c.closePath();
        c.fill();
        c.fillStyle = "rgba(0,0,0,.18)";
        c.fillRect(x + 1, y + rh - 4, rw - 2, 2);
        x += rw;
      }
      y += rh;
    }
  });
  tx.wrapS = tx.wrapT = THREE.RepeatWrapping;
  const wm = new THREE.MeshLambertMaterial({ map: tx }),
    cap = new THREE.MeshLambertMaterial({ color: 0x8a857a });
  const R = rnd(4242),
    rocks = [];
  for (let i = 0; i < outer.length - 1; i++) {
    const [x1, y1] = outer[i],
      [x2, y2] = outer[i + 1];
    const lo = 136.08 + x1 / KX_,
      la = 35.25 - y1 / 110540;
    if (!(lo > 136.058 && lo < 136.084 && la > 35.454 && la < 35.47)) continue;
    const L = Math.hypot(x2 - x1, y2 - y1);
    if (L < 1) continue;
    let nx = -(y2 - y1) / L,
      ny = (x2 - x1) / L;
    const mx = (x1 + x2) / 2,
      my = (y1 + y2) / 2;
    if (inLake(mx + nx * 20, my + ny * 20)) {
      nx = -nx;
      ny = -ny;
    }
    const step = 30;
    for (let s = 0; s < L; s += step) {
      const u = s / L,
        l = Math.min(step, L - s),
        bx = x1 + (x2 - x1) * (u + l / L / 2) + nx * 9,
        by = y1 + (y2 - y1) * (u + l / L / 2) + ny * 9;
      const gy = 0.6 + terrainAt(bx, by) * S * VEX;
      const w = new THREE.Mesh(new THREE.BoxGeometry(l * S + 0.3, 3.6, 0.9), wm);
      w.geometry.attributes.uv.array.forEach((v, k, a) => {
        if (k % 2 === 0) a[k] = (v * (l * S)) / 6;
      });
      w.position.set(bx * S, gy + 0.9, by * S);
      w.rotation.y = -Math.atan2(y2 - y1, x2 - x1);
      g.add(w);
      const cp = new THREE.Mesh(new THREE.BoxGeometry(l * S + 0.3, 0.25, 1.1), cap);
      cp.position.set(bx * S, gy + 2.75, by * S);
      cp.rotation.y = w.rotation.y;
      g.add(cp);
      for (let k = 0; k < 5; k++) {
        const f = R() * l,
          o = 1 + R() * 8;
        const rx = x1 + (x2 - x1) * ((s + f) / L) + nx * (9 - o),
          ry = y1 + (y2 - y1) * ((s + f) / L) + ny * (9 - o);
        rocks.push([rx, ry, 0.2 + R() * 0.5]);
      }
    }
  }
  const ri = new THREE.InstancedMesh(
    new THREE.DodecahedronGeometry(1, 0),
    new THREE.MeshLambertMaterial({ color: 0xffffff }),
    Math.max(1, rocks.length),
  );
  const M = new THREE.Matrix4(),
    Qq = new THREE.Quaternion(),
    E = new THREE.Euler(),
    c = new THREE.Color();
  rocks.forEach(([x, y, s], i) => {
    const gy = inLake(x, y) ? -0.3 : 0.6 + terrainAt(x, y) * S * VEX - 0.2;
    M.compose(
      new THREE.Vector3(x * S, gy, y * S),
      Qq.setFromEuler(E.set(R() * 3, R() * 3, R() * 3)),
      new THREE.Vector3(s * 1.3, s * 0.8, s),
    );
    ri.setMatrixAt(i, M);
    ri.setColorAt(i, c.setRGB(0.42 + R() * 0.14, 0.41 + R() * 0.13, 0.39 + R() * 0.11));
  });
  g.add(ri);
  return { g, n: rocks.length };
})();

G.isl = (() => {
  const R = rnd(3131),
    rk = [],
    tr = [];
  for (const poly of islands) {
    for (let i = 0; i < poly.length - 1; i++) {
      const [x1, y1] = poly[i],
        [x2, y2] = poly[i + 1];
      const L = Math.hypot(x2 - x1, y2 - y1);
      for (let s = 0; s < L; s += 14) {
        const u = s / L,
          x = x1 + (x2 - x1) * u,
          y = y1 + (y2 - y1) * u;
        for (let k = 0; k < 2; k++) {
          const a = R() * 6.28,
            r = R() * 10;
          rk.push([x + Math.cos(a) * r, y + Math.sin(a) * r, 1.2 + R() * 2.2]);
        }
      }
    }
    let cx = 0,
      cy = 0;
    for (const p of poly) {
      cx += p[0];
      cy += p[1];
    }
    cx /= poly.length;
    cy /= poly.length;
    for (let k = 0; k < 600; k++) {
      const p = poly[Math.floor(R() * poly.length)],
        u = Math.sqrt(R()) * 0.92,
        x = cx + (p[0] - cx) * u,
        y = cy + (p[1] - cy) * u;
      if (inLake(x, y)) continue;
      tr.push([x, y, 0.6 + terrainAt(x, y) * S * VEX, 0.8 + R() * 0.6, R()]);
    }
  }
  const I = new THREE.InstancedMesh(
    new THREE.DodecahedronGeometry(1, 0),
    new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true }),
    Math.max(1, rk.length),
  );
  const M = new THREE.Matrix4(),
    Qq = new THREE.Quaternion(),
    E = new THREE.Euler(),
    c = new THREE.Color();
  rk.forEach(([x, y, s], i) => {
    M.compose(
      new THREE.Vector3(x * S, s * 0.25, y * S),
      Qq.setFromEuler(E.set(R() * 3, R() * 3, R() * 3)),
      new THREE.Vector3(s, s * 1.4, s),
    );
    I.setMatrixAt(i, M);
    I.setColorAt(i, c.setRGB(0.6 + R() * 0.12, 0.58 + R() * 0.1, 0.52 + R() * 0.1));
  });
  scene.add(I);
  if (tr.length) {
    cardForest(
      "pine",
      tr.filter((_, i) => i % 2),
      9,
      6,
      40,
      2500,
      false,
    );
    cardForest(
      "broad",
      tr.filter((_, i) => !(i % 2)),
      8,
      7,
      40,
      2500,
      false,
    );
  }
  return I;
})();

/* ---------- 湖の暮らしの気配：釣り舟、はさ掛け、眺めるだけの時間 ---------- */
G.ambience = (() => {
  const R = rnd(7171);
  // 釣り舟：湖岸から少し沖を、ゆっくり行き来する小舟（自分の近くに3そう）
  const hullM = new THREE.MeshLambertMaterial({ color: 0x5a4a3a }),
    roofM2 = new THREE.MeshLambertMaterial({ color: 0xd8d4c8 }),
    manM = new THREE.MeshLambertMaterial({ color: 0x2a2a2e });
  const mkBoat = () => {
    const g = new THREE.Group();
    const h = new THREE.Mesh(new THREE.BoxGeometry(6, 0.7, 1.6), hullM);
    h.position.y = 0.2;
    g.add(h);
    const bow = new THREE.Mesh(new THREE.ConeGeometry(0.8, 1.6, 4).rotateZ(-Math.PI / 2).rotateX(Math.PI / 4), hullM);
    bow.position.set(3.6, 0.25, 0);
    bow.scale.set(1, 0.45, 1);
    g.add(bow);
    const man = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.28, 1.2, 6), manM);
    man.position.set(-1.6, 1.1, 0);
    g.add(man);
    const hat = new THREE.Mesh(new THREE.ConeGeometry(0.45, 0.25, 8), roofM2);
    hat.position.set(-1.6, 1.85, 0);
    g.add(hat);
    const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 4.5, 4), manM);
    rod.position.set(0.2, 1.8, 0);
    rod.rotation.z = -1.0;
    g.add(rod);
    g.visible = false;
    scene.add(g);
    return { g, a: R() * 6.28, r: 0, cx: 0, cz: 0, sp: 0.004 + R() * 0.004, on: false };
  };
  const boats = [mkBoat(), mkBoat(), mkBoat()];
  // はさ掛け：稲刈り後（9〜10月）、田のわきに稲を干す木の架け
  const hzM = new THREE.MeshLambertMaterial({ color: 0xb8954a }),
    poleM = new THREE.MeshLambertMaterial({ color: 0x4a3a2a });
  const hz = paddies.filter((_, i) => i % 4 === 1);
  const rack = new THREE.InstancedMesh(new THREE.BoxGeometry(7, 1.3, 0.5).translate(0, 1.4, 0), hzM, Math.max(1, hz.length));
  const poles = new THREE.InstancedMesh(new THREE.BoxGeometry(0.12, 2.3, 0.12).translate(0, 1.15, 0), poleM, Math.max(1, hz.length * 3));
  {
    const M = new THREE.Matrix4(),
      Q2 = new THREE.Quaternion(),
      E = new THREE.Euler(),
      V = new THREE.Vector3();
    hz.forEach((p, i) => {
      const gy = 0.63 + terrainAt(p.x, p.y) * S * VEX,
        rot = -p.rot,
        ox = Math.sin(rot) * 5,
        oz = Math.cos(rot) * 5;
      Q2.setFromEuler(E.set(0, rot, 0));
      M.compose(V.set(p.x * S + ox, gy, p.y * S + oz), Q2, new THREE.Vector3(1, 1, 1));
      rack.setMatrixAt(i, M);
      for (let k = 0; k < 3; k++) {
        const s = (k - 1) * 3.4;
        M.compose(V.set(p.x * S + ox + Math.cos(rot) * s, gy, p.y * S + oz - Math.sin(rot) * s), Q2, new THREE.Vector3(1, 1, 1));
        poles.setMatrixAt(i * 3 + k, M);
      }
    });
  }
  rack.visible = poles.visible = false;
  rack.castShadow = poles.castShadow = QUALITY.treeShadow;
  scene.add(rack, poles);

  function update(dt, t, c, day) {
    const cx = camera.position.x,
      cz = camera.position.z;
    // 釣り舟は昼間だけ、自分から200〜500mの岸寄りの水面に現れる
    const daytime = day > 0.15;
    for (const b of boats) {
      if (!b.on && daytime && Math.random() < dt * 0.05) {
        for (let k = 0; k < 20; k++) {
          const a = Math.random() * 6.28,
            d = 200 + Math.random() * 300,
            x = cx + Math.cos(a) * d,
            z = cz + Math.sin(a) * d;
          const dp = depth(x / S, z / S);
          if (inLake(x / S, z / S) && dp > 2 && dp < 12) {
            b.cx = x;
            b.cz = z;
            b.r = 30 + Math.random() * 50;
            b.on = true;
            b.g.visible = true;
            break;
          }
        }
      }
      if (b.on) {
        if (!daytime || Math.hypot(b.cx - cx, b.cz - cz) > 900) {
          b.on = false;
          b.g.visible = false;
          continue;
        }
        b.a += b.sp * dt * 6;
        const x = b.cx + Math.cos(b.a) * b.r,
          z = b.cz + Math.sin(b.a) * b.r;
        b.g.position.set(x, waveH(x, z, t) * 0.8, z);
        b.g.rotation.set(0, -b.a - Math.PI / 2 + Math.PI, Math.sin(t * 1.3 + b.a) * 0.04);
      }
    }
    rack.visible = poles.visible = c.month === 8 || c.month === 9;
  }
  return { update, boats };
})();

/* ---------- 湖の詩情：湖岸の一本の木、水に浮かぶ花びらと落ち葉、刈ったヨシの束、夕方の鐘 ---------- */
G.moments = (() => {
  const R = rnd(4040);
  // 一本の木：湖岸の突き出た所に、枝を広げた木を一本ずつ（全体で約14本）
  const lone = [];
  for (let i = 2; i < outer.length - 2 && lone.length < 14; i += 7) {
    const [x0, y0] = outer[i - 2],
      [x1, y1] = outer[i],
      [x2, y2] = outer[i + 2];
    const turn = (x1 - x0) * (y2 - y1) - (y1 - y0) * (x2 - x1);
    if (Math.abs(turn) < 3e4 || R() < 0.55) continue;
    const mx = (x0 + x2) / 2,
      my = (y0 + y2) / 2,
      dx = x1 - mx,
      dy = y1 - my,
      L = Math.hypot(dx, dy) || 1,
      x = x1 - (dx / L) * 18,

G.city = (() => {

    const [x1, y1] = outer[i],

      ny = (x2 - x1) / L;

      nx = -nx;
      ny = -ny;
    }
    for (let s = 0; s < L; s += 55) {
      const u = s / L;
      for (let k = 0; k < 3; k++) {
        const off = 60 + k * 90 + R() * 60,
          x = x1 + (x2 - x1) * u + nx * off + (R() - 0.5) * 30,
          y = y1 + (y2 - y1) * u + ny * off + (R() - 0.5) * 30;
        if (inLake(x, y) || inInner(x, y) || bl.some((b) => Math.hypot(b[0] - x, b[1] - y) < 38)) continue;
        bl.push([
          x,
          y,
          14 + R() * 14,
          10 + R() * 12,
          10 + R() * 26 * (k ? 1 : 0.6),
          Math.atan2(y2 - y1, x2 - x1),

  const I = new THREE.InstancedMesh(
    new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0),

      color: 0xffffff,
      roughness: 0.8,

            g.fillRect(x, y, 6, 6);

    }),

})();

  {

    kIn.y += (ty - kIn.y) * kk;

    g.emissive.set(night ? LIGHT_COLORS[CUST.light] : 0).multiplyScalar(night ? CUST.bright * (g === G.glowMat ? 1.9 : 0.8) * flick : 0);
  portLamps.visible = night || day < 0.12;
  windows.material.size = 3.4 * (1 + (wxNow.white || 0) * 1.6);

  }
  windows.visible = night || day < 0.18;
  if (G.street) G.street.visible = night || day < 0.1;
  windows.material.opacity = day < 0.05 ? 0.95 : 0.6;
  if (paddySeason._m !== c.month) {
    if (G.grass)
      G.grass.material.color.set(SEASON.grass[c.month]);
    roofSnowU.value = SEASON.roofSnow[c.month];
    roofM.color.setScalar(1 + roofSnowU.value * 2.2);
    (G.forest || []).forEach((I) => {
      if (I.userData.kind === "broad") {
        const au = c.month === 9 || c.month === 10;
        I.material.color.set(au ? 0xffffff : FOREST_TINT[c.month]);
        if (I.instanceColor) {
          const P = [0xff8a3a, 0xffc23a, 0xff5a32, 0xffa848, 0xe8d870, 0xfff090, 0xc8e090],
            cc = new THREE.Color();
          for (let i = 0; i < I.count; i++) {
            if (au)
              cc.set(P[(i * 13 + I.id) % (c.month === 9 ? 7 : 6)]).multiplyScalar(
                1.05 + ((i * 13) % 7) * 0.03,
              );
            else cc.setScalar(1.05 + ((i * 13) % 7) * 0.04);

          }

        }
      } else I.material.color.set(SNOW[c.month] > 0.6 ? 0xdfe6e8 : 0xffffff);
    });
    treeSeason(c.month);
    paddySeason(c.month, sky);
    paddySeason._m = c.month;
  }
  return { wxNow, day, night, sunAngle };
}

/* ---------- 毎フレーム③：建物の浮き沈みと傾き、目的地の印、引き波 ---------- */
function floatHouse(dt, t, W, day) {
  // 建物の浮き沈み（画面は傾けない）
  const hx = B.x * S,
    hz = B.y * S,
    slow = Math.sqrt(Math.max(1, house.size / 8)),
    wb = wakeBob * Math.sin(t * 2.6) * (RM ? 0.4 : 1),
    h0 = waveH(hx, hz, t) + wb,
    hF = waveH(hx + Math.cos(B.yaw) * 5, hz + Math.sin(B.yaw) * 5, t),
    hS = waveH(hx - Math.sin(B.yaw) * 3, hz + Math.cos(B.yaw) * 3, t);
  const inIn = !inMain(B.x, B.y) && inInner(B.x, B.y);
  {
    const wl = Math.hypot(W.x, W.y) || 1;
    waterU.uWd.value.set(W.x / wl, W.y / wl);
  }
  waterU.uHouse.value.set(hx, hz, house.size * 0.6);
  {
    const tgt = inIn
      ? INNER_Y + h0 * 0.15
      : Math.max(h0, waveTop(hx, hz, t, house.size * 0.35) - 0.25) + water.position.y;
    B.hy = (B.hy || 0) + (tgt - (B.hy || 0)) * Math.min(1, (dt * 6) / slow);
    B.hy = Math.max(B.hy, tgt - 0.4);
  }
  house.position.set(hx, B.hy, hz);
  house.rotation.set(0, 0, 0);
  house.rotateY(-B.yaw + Math.sin(t * 0.4) * 0.015 * BP.rock);
  const tilt = (RM ? 0.3 : 1) * BP.rock * (12 / Math.max(8, house.size)) ** 0.5 * 1.15;
  B.rz = (B.rz || 0) + (((hF - h0) / 5) * 0.6 * tilt - (B.rz || 0)) * Math.min(1, (dt * 3) / slow);
  B.rx =
    (B.rx || 0) + ((-(hS - h0) / 3) * 0.6 * tilt + wb * 0.04 - (B.rx || 0)) * Math.min(1, (dt * 3) / slow);
  house.rotateZ(B.rz);
  house.rotateX(B.rx);
  {
    const spd = Math.hypot(B.vx || 0, B.vy || 0);
    if (false) {
      const a = Math.atan2(B.vy, B.vx),
        bx = B.x * S - Math.cos(a) * house.size * 0.45,
        bz = B.y * S - Math.sin(a) * house.size * 0.45,
        nx = -Math.sin(a),
        nz = Math.cos(a);
      for (const s of [-1, 1])
        wakeP[wakeI++ % WAKE_N] = {
          x: bx + nx * s * house.size * 0.2,
          z: bz + nz * s * house.size * 0.2,
          vx: nx * s * 0.6 - Math.cos(a) * 0.2,
          vz: nz * s * 0.6 - Math.sin(a) * 0.2,
          born: t,
          big: false,
        };
    }
  }
  if (!G.gm) {
    G.gm = new THREE.Mesh(
      new THREE.RingGeometry(1.6, 2, 32).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 }),
    );
    scene.add(G.gm);
  }
  G.gm.visible = !!B.goal;
  if (B.goal) {
    G.gm.position.set(B.goal[0] * S, 0.4, B.goal[1] * S);
    G.gm.material.opacity = 0.4 + 0.25 * Math.sin(t * 3);
  }
  if (G.wake) G.wake.material.opacity = 0.06 + 0.16 * Math.min(1, day * 3);

  {
    const tr = waterU.uTr.value,
      spd = Math.hypot(B.vx || 0, B.vy || 0) * SPEED;
    for (const v of tr) v.z += dt;
    G.trT = (G.trT || 0) + dt;
    if (spd > 0.3 && G.trT > 0.3) {
      G.trT = 0;
      let k = 0;
      for (let i = 1; i < tr.length; i++) if (tr[i].z > tr[k].z) k = i;
      const a = B.yaw,
        L = house.size * 0.45;
      tr[k].set(
        B.x * S - Math.cos(a) * L,
        B.y * S - Math.sin(a) * L,
        0,
        Math.min(1, spd / 3) * Math.min(1.4, house.size / 12),
      );
    }
  }
  return { hx, hz };
}

/* ---------- 毎フレーム④：カメラ（水平を保って建物を追う） ---------- */
function updateCamera(dt, t, hx, hz) {
  idleLook(dt);
  // カメラ：水平を保って建物を追う
  if (
    STATE === "lake" &&
    performance.now() - (G.lastDrag || 0) > 4000 &&
    Math.hypot(B.vx || 0, B.vy || 0) > 0.03
  ) {
    const behind = Math.atan2(-(B.vx || 0), -(B.vy || 0)) + Math.PI;
    let dd = behind - yawT;
    dd = Math.atan2(Math.sin(dd), Math.cos(dd));
    yawT += dd * Math.min(1, dt * 0.25);
  }
  if (STATE === "lake") {
    let dy = yawT - yaw;
    yaw += dy * (1 - Math.exp(-dt * 4.5));
    if (!ptrs.size) dist += (distT - dist) * (1 - Math.exp(-dt * 3.5));
    else distT = dist;
  }
  if (STATE !== "lake") {
    yaw += dt * 0.12;
    yawT = yaw;
    dist = Math.max(26, house.size * 1.7, house.h * 2.6);
  }
  if (G.lock) {
    camX = G.lock[0];
    camZ = G.lock[1];
  } else {
    const k = 1 - Math.exp(-dt * 2.6);
    camX += (hx - camX) * k;
    camZ += (hz - camZ) * k;
  }
  const pc = STATE === "lake" ? Math.max(0.04, pitch) : Math.atan2(house.h * 0.5 + dist * 0.2, dist),
    hd = dist * Math.cos(pc),
    ch = Math.max(3.5, (STATE === "lake" ? 2 : 0) + dist * Math.sin(pc));
  const lookUp = STATE === "lake" && pitch < 0.04 ? Math.tan(Math.min(1.2, 0.04 - pitch)) * hd : 0;
  camera.position.set(camX + Math.sin(yaw) * hd, ch, camZ + Math.cos(yaw) * hd);
  {
    const gh =
      (inLake(camera.position.x / S, camera.position.z / S)
        ? 0
        : terrainAt(camera.position.x / S, camera.position.z / S) * S * VEX) + 1.5;
    if (camera.position.y < gh) camera.position.y = gh;
  }
  camera.lookAt(camX, (STATE === "lake" ? 2 : house.h * 0.45) + lookUp, camZ);
  {
    const wv = waveH(camera.position.x, camera.position.z, t) + water.position.y + 1.5;
    if (camera.position.y < wv) camera.position.y = wv;
  }
  if (STATE === "lake") {
    if (camera.view && camera.view.enabled) camera.clearViewOffset();
  } else {
    const w = innerWidth,
      h = innerHeight;
    camera.setViewOffset(w, h, 0, h * 0.2, w, h);
  }
}

// ==== 51-frame.js ====
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  fpsN++;
  fpsT += dt;
  if (fpsT > 3) {
    const f = fpsN / fpsT;
    const old = resScale;
    if (f < 38) resScale = Math.max(0.5, resScale - 0.1);
    else if (f > 57) resScale = Math.min(QUALITY.resMax, resScale + 0.05);
    if (old !== resScale) resize();
    fpsN = 0;
    fpsT = 0;
  }
  const c = clock(),
    W = wind(c),
    t = now / 1000;
  moveHouse(dt, c, W);
  const boats = boatState(c);
  trailT += dt;
  if (STATE === "lake" && trailT > 1.5) {
    trailT = 0;
    B.trail.push([B.x, B.y]);
    if (B.trail.length > 4000) B.trail.shift();
  }

  {
    let nr = 0;
    const cx = Math.floor(B.x / 120),
      cy = Math.floor(B.y / 120);
    for (let a = -3; a <= 3; a++)
      for (let b = -3; b <= 3; b++)
        if (reedMask.has(cx + a + "," + (cy + b))) nr = Math.max(nr, 1 - Math.hypot(a, b) / 4.3);
    audioUpdate(dt, c, W, boats, nr);
  }
  if (isFar) {
    drawFar(boats, W.wx, W);
    requestAnimationFrame(frame);
    return;
  }

  const { wxNow, day, night, sunAngle } = updateSkyLight(dt, t, c, W);
  const { hx, hz } = floatHouse(dt, t, W, day);
  updateBoats(boats, dt, t, night);
  if (FW) FW.update(dt, c, day);
  if (G.buoys) G.buoys.update(t, day < 0.08);
  if (G.EV) G.EV.update(dt, c, day, t, W);
  if (G.ambience) G.ambience.update(dt, t, c, day);
  if (G.moments) G.moments.update(dt, t, c, W);
  if (G.life) G.life.update(dt, t, c, day, wxNow);
  updateCamera(dt, t, hx, hz);
  renderFrame(c, W, wxNow, day, sunAngle);
  requestAnimationFrame(frame);
}

    const [x, y] = ll(lo, la);
    B.x = x + dx; B.y = y + dy; B.vx = B.vy = 0; camX = B.x * S; camZ = B.y * S;
    yaw = yawT = yw; pitch = pt; dist = distT = ds;
  };
}
requestAnimationFrame(frame);
requestAnimationFrame(() => (document.getElementById("veil").style.opacity = 0));

</script>
